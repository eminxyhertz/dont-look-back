<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DON'T LOOK BACK — Nightmare Edition</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#020202;color:#ddd;font-family:ui-monospace,Consolas,monospace;display:flex;justify-content:center;min-height:100vh;padding:18px}
.game{width:min(760px,100%);background:#050505;border:1px solid #252525;border-radius:14px;overflow:hidden}
.top{display:flex;justify-content:space-between;gap:12px;padding:12px 15px;background:#090909;border-bottom:1px solid #222}
.label{font-size:9px;letter-spacing:.16em;color:#666}.value{font-size:14px;color:#bbb}.meter{width:92px;height:4px;background:#222;margin-top:6px}.meter i{display:block;height:100%;width:100%;background:#888}
.scene{position:relative;min-height:450px;overflow:hidden;background:#080808}
.picture{position:absolute;inset:0;transition:filter .4s,opacity .4s}
.room{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 35%,#242424 0,#101010 35%,#020202 80%)}
.wallline{position:absolute;left:0;right:0;top:66%;height:1px;background:#272727}
.door{position:absolute;width:112px;height:235px;left:50%;top:55px;transform:translateX(-50%);background:#030303;border:2px solid #303030;box-shadow:0 0 60px #000}
.door:after{content:"";position:absolute;width:6px;height:6px;border-radius:50%;right:12px;top:120px;background:#777}
.floor{position:absolute;left:0;right:0;bottom:0;height:155px;background:repeating-linear-gradient(90deg,#060606 0 50px,#101010 50px 51px);clip-path:polygon(17% 0,83% 0,100% 100%,0 100%)}
.frame{position:absolute;left:13%;top:20%;width:80px;height:95px;border:5px solid #181818;background:#030303;box-shadow:0 0 15px #000}
.frame:after{content:"";position:absolute;inset:9px;background:linear-gradient(135deg,#101010,#020202 55%,#222)}
.bed{position:absolute;left:8%;bottom:24%;width:145px;height:55px;background:#111;border:1px solid #252525;transform:skewY(-3deg)}
.bed:before{content:"";position:absolute;left:8px;top:-28px;width:105px;height:30px;background:#171717;border:1px solid #292929}
.figure{position:absolute;z-index:2;width:39px;height:145px;left:50%;top:92px;transform:translateX(-50%);background:#000;border-radius:45% 45% 8% 8%;opacity:0;filter:blur(2px);transition:opacity .25s}
.figure:before{content:"";position:absolute;width:46px;height:46px;border-radius:50%;left:-3px;top:-34px;background:#000}
.figure:after{content:"•  •";position:absolute;color:#aaa;font-size:10px;left:6px;top:-19px;letter-spacing:6px}
.shadow{position:absolute;z-index:2;left:47%;bottom:14%;width:90px;height:20px;background:#000;border-radius:50%;filter:blur(12px);opacity:0}
.text{position:absolute;z-index:5;left:18px;right:18px;bottom:18px;background:rgba(0,0,0,.84);border-left:2px solid #555;padding:13px 15px;line-height:1.55;font-size:13px;min-height:67px}
.actions{padding:13px 15px;background:#080808;border-top:1px solid #222;display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;font-size:11px;color:#ccc;background:#111;border:1px solid #333;border-radius:7px;padding:11px 13px;min-height:44px;cursor:pointer}
button:hover{background:#191919;border-color:#777}button:focus-visible{outline:2px solid #aaa}
button.bad{background:#180b0b;border-color:#542828}
.overlay{position:absolute;z-index:20;inset:0;background:#000;display:flex;align-items:center;justify-content:center;text-align:center;padding:25px}
.overlay h1{font-size:29px;letter-spacing:.12em;margin:0 0 12px}.overlay p{max-width:480px;color:#999;line-height:1.6;font-size:13px}
.scare{position:absolute;z-index:50;inset:0;display:flex;align-items:center;justify-content:center;background:#000;opacity:0;pointer-events:none}
.scare .face{width:190px;height:250px;position:relative;background:#050505;border-radius:48% 48% 45% 45%;box-shadow:0 0 70px #000}
.scare .eye{position:absolute;top:78px;width:27px;height:12px;background:#ddd;border-radius:50%;box-shadow:0 0 12px #aaa}
.scare .e1{left:43px}.scare .e2{right:43px}
.scare .mouth{position:absolute;left:55px;right:55px;bottom:54px;height:78px;border-radius:10px 10px 45% 45%;background:#000;border:2px solid #333}
.scare.flash{animation:flash .7s steps(2,end)}.scare.shake{animation:flash .45s steps(2,end)}
@keyframes flash{0%{opacity:0;transform:scale(1)}12%{opacity:1;transform:scale(1.04)}28%{opacity:1;transform:scale(1)}45%{opacity:0}60%{opacity:1}100%{opacity:0}}
@media(max-width:520px){.scene{min-height:430px}.text{font-size:12px}}

/* Audio controls */
.top { display:flex; justify-content:space-between; align-items:center; gap:12px; }
.volume-control {
  display:flex; align-items:center; gap:6px; color:#aaa; font-size:12px;
  user-select:none;
}
.volume-control input { width:85px; accent-color:#b30000; cursor:pointer; }

/* Brief visual/audio feedback */
.audio-pulse {
  animation: audioPulse .16s ease-out;
}
@keyframes audioPulse {
  0% { filter: brightness(1); }
  50% { filter: brightness(1.8); }
  100% { filter: brightness(1); }
}
.sound-test {
  margin-left: 8px; background:#161616; color:#ddd; border:1px solid #444;
  padding:10px 14px; border-radius:5px; cursor:pointer;
}
.sound-test:hover { background:#222; }
''</style>
</head>
<body>
<div class="game">
<div class="top">
<div><div class="label">Apartment</div><div class="value">6</div></div>
<div><div class="label">Time</div><div class="value" id="clock">05:00</div></div>
<div><div class="label">Fear</div><div class="meter"><i id="fear"></i></div></div>
</div>
<div class="scene" id="scene">
<div class="picture room" id="picture">
<div class="frame"></div><div class="bed"></div><div class="door"></div><div class="floor"></div>
<div class="figure" id="figure"></div><div class="shadow" id="shadow"></div>
</div>
<div class="text" id="story">Three knocks come from inside your apartment.<br><small style="color:#888">Turn your phone volume up. Tap 🔊 Test Sound if you cannot hear anything.</small></div>
<div class="overlay" id="overlay"><div><h1 id="endTitle">DON'T LOOK BACK</h1><p id="intro">You have five minutes until sunrise. Something is inside your apartment.</p><p><b>There is only one rule: never look behind you.</b></p><button id="begin">Begin</button></div></div>
<div class="scare" id="scare"><div class="face"><div class="eye e1"></div><div class="eye e2"></div><div class="mouth"></div></div></div>
</div>
<div class="actions" id="actions"></div>
</div>
<script>
/* =========================
   OFFLINE HORROR AUDIO ENGINE
   Everything is synthesized in-browser:
   no external audio files are required.
   ========================= */
let audioCtx = null;
let masterGain = null;
let audioReady = false;

function initAudio() {
  if (audioReady) {
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    return;
  }
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.82;
    masterGain.connect(audioCtx.destination);
    audioReady = true;
    audioCtx.resume().catch(() => {});
  } catch(e) {}
}

function setVolume(v) {
  if (!masterGain) return;
  masterGain.gain.setTargetAtTime((Number(v) / 100) * 0.95, audioCtx.currentTime, 0.02);
}

function osc(type, freq, start, duration, gain, endFreq=null, destination=masterGain) {
  if (!audioReady) return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, start);
  if (endFreq !== null) o.frequency.exponentialRampToValueAtTime(Math.max(20,endFreq), start + duration);
  g.gain.setValueAtTime(0.0001, start);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0001,gain), start + Math.min(0.015,duration/4));
  g.gain.exponentialRampToValueAtTime(0.0001, start + duration);
  o.connect(g);
  g.connect(destination);
  o.start(start);
  o.stop(start + duration + 0.03);
}

function noise(duration, gain, filterType="bandpass", freq=900, q=1, delay=0) {
  if (!audioReady) return;
  const now = audioCtx.currentTime + delay;
  const buffer = audioCtx.createBuffer(1, Math.floor(audioCtx.sampleRate * duration), audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i=0;i<data.length;i++) {
    const fade = Math.min(1, i/(data.length*.05), (data.length-i)/(data.length*.12));
    data[i] = (Math.random()*2-1) * fade;
  }
  const source = audioCtx.createBufferSource();
  const filter = audioCtx.createBiquadFilter();
  const g = audioCtx.createGain();
  source.buffer = buffer;
  filter.type = filterType;
  filter.frequency.value = freq;
  filter.Q.value = q;
  g.gain.setValueAtTime(0.0001, now);
  g.gain.exponentialRampToValueAtTime(gain, now + Math.min(.025,duration*.15));
  g.gain.exponentialRampToValueAtTime(0.0001, now + duration);
  source.connect(filter); filter.connect(g); g.connect(masterGain);
  source.start(now);
}

function breathing(intensity=1) {
  if (!audioReady) return;
  const now = audioCtx.currentTime;
  noise(.75, .055*intensity, "lowpass", 520, .7, 0);
  noise(.95, .075*intensity, "lowpass", 430, .7, .65);
  osc("sine", 72, now, .95, .018*intensity, 48);
}

function heartbeat(intensity=1) {
  if (!audioReady) return;
  const now = audioCtx.currentTime;
  osc("sine", 62, now, .13, .12*intensity, 45);
  osc("sine", 48, now+.17, .15, .09*intensity, 38);
}

function whisper() {
  if (!audioReady) return;
  noise(.42, .035, "bandpass", 1800, 3);
  noise(.55, .025, "bandpass", 2600, 5, .22);
}

function knock() {
  if (!audioReady) return;
  const now = audioCtx.currentTime;
  osc("triangle", 95, now, .11, .16, 48);
  osc("sine", 70, now+.16, .11, .13, 42);
  osc("triangle", 82, now+.33, .12, .15, 40);
}

function sting() {
  if (!audioReady) return;
  const now = audioCtx.currentTime;
  osc("sawtooth", 520, now, .24, .11, 95);
  osc("square", 180, now+.02, .42, .055, 38);
  noise(.28, .07, "highpass", 1900, 2, .03);
}

function bassHit() {
  if (!audioReady) return;
  const now = audioCtx.currentTime;
  osc("sine", 70, now, .75, .30, 24);
  osc("triangle", 115, now, .35, .10, 35);
  noise(.55, .12, "lowpass", 260, .8, .01);
}

function distortionBurst() {
  if (!audioReady) return;
  const now = audioCtx.currentTime;
  const shaper = audioCtx.createWaveShaper();
  const curve = new Float32Array(44100);
  for (let i=0;i<curve.length;i++) {
    const x = i*2/curve.length-1;
    curve[i] = Math.tanh(x*9);
  }
  shaper.curve = curve;
  shaper.oversample = "2x";
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(.0001, now);
  g.gain.exponentialRampToValueAtTime(.17, now+.015);
  g.gain.exponentialRampToValueAtTime(.0001, now+.38);
  const o = audioCtx.createOscillator();
  o.type = "sawtooth";
  o.frequency.setValueAtTime(900, now);
  o.frequency.exponentialRampToValueAtTime(75, now+.38);
  o.connect(shaper); shaper.connect(g); g.connect(masterGain);
  o.start(now); o.stop(now+.42);
  noise(.32, .14, "highpass", 2400, 1.5, .01);
}

function bigJumpscareSound() {
  if (!audioReady) return;
  bassHit();
  distortionBurst();
  sting();
  setTimeout(() => noise(.65, .08, "bandpass", 1300, 1.2), 70);
  setTimeout(() => heartbeat(1.3), 260);
}

function footsteps() {
  if (!audioReady) return;
  knock();
  setTimeout(() => osc("triangle", 62, audioCtx.currentTime, .10, .08, 38), 230);
}

function silenceForMoment() {
  if (!audioReady || !masterGain) return;
  masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
  masterGain.gain.setTargetAtTime(0.0001, audioCtx.currentTime, .035);
  setTimeout(() => {
    if (audioReady) masterGain.gain.setTargetAtTime(
      (Number(document.getElementById("volume")?.value || 65)/100)*.95,
      audioCtx.currentTime, .12
    );
  }, 650);
}

function audioEvent(kind) {
  initAudio();
  if (!audioReady) return;
  if (audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
  if (kind === "knock") knock();
  else if (kind === "breath") breathing(1.15);
  else if (kind === "whisper") whisper();
  else if (kind === "steps") footsteps();
  else if (kind === "sting") sting();
  else if (kind === "big") bigJumpscareSound();
  else if (kind === "heartbeat") heartbeat(1.2);
  else if (kind === "silence") silenceForMoment();
}


(()=> {
const $=s=>document.querySelector(s);
const story=$('#story'),actions=$('#actions'),clock=$('#clock'),fear=$('#fear'),figure=$('#figure'),shadow=$('#shadow'),overlay=$('#overlay'),endTitle=$('#endTitle'),intro=$('#intro'),begin=$('#begin'),scareLayer=$('#scare'),picture=$('#picture');
let t=300,f=0,dead=false,interval,hasKey=false,power=false,started=false;

function render(){clock.textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');fear.style.width=Math.max(0,100-f)+'%';figure.style.opacity=f>30?Math.min(.9,(f-30)/50):0}
function text(x){story.textContent=x}
function btn(list){actions.innerHTML='';list.forEach(([label,fn,bad])=>{const b=document.createElement('button');b.textContent=label;if(bad)b.className='bad';b.onclick=fn;actions.appendChild(b)})}
function jumpscare(kind='face'){
  if(dead)return;
  scareLayer.classList.remove('flash','shake');void scareLayer.offsetWidth;
  scareLayer.classList.add(kind==='hard'?'shake':'flash');
  if(navigator.vibrate)try{navigator.vibrate([70,35,100])}catch(e){}
}
function die(title,msg){dead=true;clearInterval(interval);endTitle.textContent=title;intro.textContent=msg;begin.textContent='Restart';overlay.style.display='flex'}
function scare(n,msg){
  initAudio();
  if (n >= 3) breathing(Math.min(1.5, 0.7 + n/8));
  else if (n === 2) whisper();
  else knock();f+=n;text(msg);render();if(f>=100){jumpscare('hard');setTimeout(()=>die('IT KNOWS','You tried to stay calm. You failed. The breathing is no longer behind you. It is inside your chest.'),450)}}
function tick(){
 if(dead)return;
 t--;
 if(t===275){text('Three knocks. Pause. Three knocks. Pause. Then one knock from directly behind you.')}
 if(t===245){jumpscare();text('Something moved in the picture frame. When you look again, it is still.')}
 if(t===210){text('The clock says 03:30. You are certain it said 04:02 a moment ago.')}
 if(t===175){figure.style.opacity=.65;jumpscare();setTimeout(()=>{if(!dead)figure.style.opacity=f>30?.7:0},300);text('For less than a second, there was someone standing in front of the door.')}
 if(t===135){text('A voice whispers: “You have done this before.”')}
 if(t===95){picture.style.filter='brightness(.55) contrast(1.3)';text('The room looks different. You cannot remember owning that bed.')}
 if(t===65){shadow.style.opacity=.8;jumpscare();text('The breathing suddenly stops. Something is standing behind you.')}
 if(t<=0)die('SUNRISE','The window turns grey. You survived. Then your phone lights up with a photo of you sleeping. The photo was taken one minute ago.');
 render();
}
function start(){dead=false;started=true;t=300;f=0;hasKey=false;power=false;picture.style.filter='';figure.style.opacity=0;shadow.style.opacity=0;overlay.style.display='none';text('Three knocks come from inside your apartment. You live alone.');btn([['Check the bedroom',bed],['Check the front door',door],['Stay completely still',still]]);clearInterval(interval);interval=setInterval(tick,1000);render()}
function still(){scare(8,'You do not move. The breathing stops. Three seconds pass. Then something whispers your name from underneath the bed.');btn([['Look underneath',under],['Get up without looking',kitchen]])}
function bed(){scare(12,'Your bedroom is empty. Your bed is made. You remember leaving it messy. On the pillow is a note: “STOP CHECKING.”');btn([['Read the note',note],['Leave the room',kitchen]])}
function note(){scare(15,'The note changes while you read it. Now it says: “I SAW YOU CHOOSE THIS.”');btn([['Take the note',take],['Drop it',kitchen]])}
function take(){scare(8,'The paper is warm. On the back is a crude drawing of this room. There is a black figure drawn directly behind you.');btn([['Get the keys',kitchen],['Turn around',turn]])}
function under(){jumpscare('hard');setTimeout(()=>die('UNDER THE BED','There is nothing underneath. You exhale. Then two hands slowly grip the edge of the mattress from underneath.'),350)}
function door(){scare(10,'You look through the peephole. The hallway is empty. Then a face appears against the glass from the OTHER SIDE of the peephole.');jumpscare();btn([['Step away',kitchen],['Open the door',open]])}
function kitchen(){text('The kitchen is exactly as you remember it. Except the clock is missing. Your keys are on the counter. So is a second set of keys.');btn([['Take your keys',keys],['Take the other keys',wrongKeys]])}
function keys(){hasKey=true;scare(5,'Your keys are freezing cold. The second set suddenly disappears. You hear footsteps upstairs. You do not have an upstairs.');btn([['Go to the basement',basement],['Return to the front door',front]])}
function wrongKeys(){jumpscare('hard');setTimeout(()=>die('WRONG KEYS','The keys fit your front door. You open it. Your apartment is on the other side of the door. You can see yourself standing in the kitchen.'),400)}
function open(){scare(18,'The door opens. The hallway is completely dark. Your neighbor’s door is open. Inside is another version of your apartment.');btn([['Enter the hallway',hall],['Close the door',front]])}
function front(){if(!hasKey){text('You need your keys. Something behind you whispers: “You already picked them up.”');return}text('The front door is directly ahead. The breathing has stopped. The handle is slowly turning by itself.');btn([['Open it',open],['Go to the basement',basement]])}
function basement(){if(!hasKey){text('The basement door is locked.');return}scare(7,'You descend into the basement. At the bottom is an electrical panel. Behind you, footsteps begin descending the stairs.');btn([['Turn off the power',breaker],['Hide behind the boiler',hide]])}
function hide(){scare(20,'You hide. The footsteps stop. A shadow appears underneath the boiler. It has fingers. They slowly curl around the corner.');btn([['Stay hidden',stay],['Run upstairs',run]])}
function stay(){jumpscare();scare(18,'You hear breathing directly beside your ear. A voice whispers: “Good choice.” You never chose anything.');btn([['Wait',wait],['Look behind you',turn]])}
function wait(){t=Math.max(0,t-20);scare(12,'Nothing happens. Then you notice the basement has no stairs anymore. There is only a wall behind you.');btn([['Turn off the power',breaker]])}
function breaker(){power=true;scare(10,'You pull the breaker. Everything goes black. For one second, the room is silent. Then the breaker clicks back ON by itself.');btn([['Pull it again',breaker2],['Leave',upstairs]])}
function breaker2(){power=true;jumpscare();scare(20,'You pull it down again. This time it stays down. In the darkness, something laughs. Not behind you. From inside the electrical panel.');btn([['Run upstairs',upstairs]])}
function run(){scare(25,'You sprint upstairs. The footsteps chase you. You reach the door. A hand grabs your shoulder.');btn([['Keep running',upstairs],['Turn around',turn]])}
function upstairs(){text('You reach the apartment. Everything is dark. The front door is open. You can see the hallway outside.');btn([['Leave',escape],['Look into the apartment',look]])}
function look(){jumpscare('hard');setTimeout(()=>die('IT WAS YOU','You look inside. Someone is sitting on your bed. It is you. It looks up and smiles. Your screen goes black for three seconds. When the image returns, it is standing behind you.'),450)}
function escape(){if(!power)return die('NOT YET','You step outside. The hallway lights flicker on. Every apartment door is open. Every room contains someone standing perfectly still, facing you.');die('YOU MADE IT OUT','You step into the hallway. Your apartment door closes behind you. Three knocks come from inside it. Then your phone vibrates: “WHY DID YOU LEAVE ME IN THERE?”')}
function hall(){jumpscare();setTimeout(()=>die('THE HALLWAY','You step into the darkness. Your apartment door closes behind you. From the other side: three knocks. Then your own voice says, “Let me out.”'),400)}
function turn(){jumpscare('hard');setTimeout(()=>die('DON’T LOOK','You turn around. Nothing is there. You laugh nervously. Then you realize the game has stopped displaying your character. You are no longer playing from behind yourself. Something else is.'),450)}
begin.onclick=start;render();
})();

const volumeSlider = document.getElementById("volume");
if (volumeSlider) volumeSlider.addEventListener("input", e => {
  initAudio();
  setVolume(e.target.value);
});

const soundTest = document.getElementById("soundTest");
if (soundTest) {
  soundTest.addEventListener("click", (e) => {
    e.stopPropagation();
    initAudio();
    setVolume(volumeSlider ? volumeSlider.value : 65);
    if (audioReady) {
      // A very obvious test tone so the player can verify browser audio.
      const now = audioCtx.currentTime;
      osc("sine", 440, now, .22, .22, 660);
      setTimeout(() => osc("sine", 660, audioCtx.currentTime, .22, .20, 880), 180);
    }
  });
}

document.addEventListener("click", () => {
  initAudio();
  if (volumeSlider) setVolume(volumeSlider.value);
}, {passive:true});


/* Atmospheric timing layer: synced to the existing 5-minute countdown. */
let lastAudioTime = -1;
function atmosphericAudioTick() {
  if (!audioReady || typeof t !== "number") return;
  if (t === lastAudioTime) return;
  lastAudioTime = t;
  if ([278, 248, 213, 178, 138, 98, 68].includes(t)) {
    audioEvent("breath");
  }
  if ([268, 238, 198, 158, 118, 78].includes(t)) {
    audioEvent("whisper");
  }
  if ([258, 228, 188, 148, 108, 88].includes(t)) {
    audioEvent("steps");
  }
}
setInterval(atmosphericAudioTick, 1000);

</script>
